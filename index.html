<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>BY.SHOP - پیش‌نمایش</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #1a1a1a; color: #fff; text-align: center; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .product-card { background: #333; padding: 20px; border: 2px solid #555; border-radius: 10px; }
        .price { color: #00ff00; font-weight: bold; }
        button { background: #00ff00; border: none; padding: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h1>BY.SHOP</h1>
    <div class="product-grid" id="product-list">درحال دریافت محصولات از سرور...</div>

    <script>
        // این لینکِ نمونه است که من برای تست تو ساختم:
        const apiLink = "https://api.npoint.io/4694406295328229b46f";

        async function loadProducts() {
            try {
                const response = await fetch(apiLink);
                const products = await response.json();
                const container = document.getElementById('product-list');
                container.innerHTML = ''; 

                products.forEach(p => {
                    container.innerHTML += `
                        <div class="product-card">
                            <h3>${p.name}</h3>
                            <p class="price">${p.price} تومان</p>
                            <button onclick="alert('سفارش ${p.name} ثبت شد!')">خرید</button>
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('product-list').innerText = "خطا در اتصال!";
            }
        }

        loadProducts();
    </script>
</body>
</html>
